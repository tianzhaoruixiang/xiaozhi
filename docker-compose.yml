services:
  api:
    image: ${API_IMAGE:-xiaozhi-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env
    environment:
      PORT: 3000
      HOME: /data/runtime
      AGENT_CONFIG_ROOT: /app/.claude
      XIAOZHI_ORCHESTRATION: hybrid
      XIAOZHI_DEFAULT_TEAM: personnel-dispatch
      XIAOZHI_DEFAULT_WORKFLOW: personnel-dispatch
      # 语音模型在宿主机固定运行，容器经 host.docker.internal 访问
      TTS_URL: ${TTS_URL_DOCKER:-http://host.docker.internal:8090}
      TTS_SPEECH_URL: ${TTS_SPEECH_URL_DOCKER:-http://host.docker.internal:8090}
      TTS_MODEL: ${TTS_MODEL:-kokoro-int8-multi-lang-v1_1}
      TTS_VOICE: ${TTS_VOICE:-zf_001}
      LLM_TIMEOUT_MS: "45000"
      HRBP_REPORT_DIR: /data/hrbp-reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./.claude:/app/.claude:ro
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  vllm-omni:
    profiles: ["vllm-omni"]
    image: ${VLLM_OMNI_IMAGE:-vllm/vllm-omni-rocm:v0.28.0}
    ipc: host
    shm_size: "8gb"
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      # Docker Desktop / WSL2 上 AMD 不走 NVIDIA runtime，GPU 入口是 /dev/dxg
      - /dev/dxg
    ports:
      - "${VLLM_OMNI_PORT:-8091}:8091"
    volumes:
      - ./data/models/hf-home:/root/.cache/huggingface
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_TELEMETRY: "1"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      HSA_ENABLE_DXG_DETECTION: "1"
    # ROCm 镜像入口已是 vllm serve，参数从 --model 开始
    command:
      - --model
      - ${TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      - --omni
      - --port
      - "8091"
      - --trust-remote-code
      - --enforce-eager
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/v1/models')",
        ]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  tts:
    profiles: ["container-tts"]
    build:
      context: ./tts
    environment:
      TTS_MODEL_DIR: /data/models/kokoro-int8-multi-lang-v1_1
      ASR_MODEL_DIR: /data/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
      ASR_NUM_THREADS: "6"
      ASR_PROVIDER: cpu
      TTS_NUM_THREADS: "4"
      TTS_SPEED: "1.0"
      TTS_PROVIDER: cpu
      TTS_SPEAKER_ID: "3"
    volumes:
      - ./data:/data
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-xiaozhi-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: app
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
