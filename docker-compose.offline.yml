# 内网发布：只叠 dist，FROM 已导入的底包，构建不访问网络
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.overlay
      target: app
      network: none
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-xiaozhi-api:base}
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.overlay
      target: app
      network: none
      args:
        BASE_IMAGE: ${WEB_BASE_IMAGE:-xiaozhi-web:base}
