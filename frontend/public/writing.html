<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小智 · 总结材料生成工作台</title>
  <style>
    /* ===================== 小智工作台色板（与 tokens.css 一致：深海水蓝底 × 浅色玻璃面板 × 信号青 × 香槟铜） ===================== */
    :root {
      color-scheme: light;
      --color-abyss: #06141f;
      --color-steel: #0f2a3d;
      --color-signal: #2ec4d6;
      --color-brass: #c9a86c;
      --color-mist: #e7f0f6;
      --color-ink: #14283a;
      --color-ink-muted: #5a7084;
      --color-accent: #1a7a92;
      --color-cyan: #6ad4e4;
      --color-gold-soft: #e6d4a8;
      --color-success: #2f7d5a;
      --color-danger: #a84848;
      --color-line: rgba(20, 40, 58, 0.1);
      --color-line-bright: rgba(46, 196, 214, 0.42);
      --panel-deep: rgba(255, 255, 255, 0.7);
      --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
      --font-body: 'Sora', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      --shadow-soft: 0 22px 56px rgba(6, 20, 31, 0.14);
      --shadow-glow: 0 0 36px rgba(46, 196, 214, 0.16);
      --radius-lg: 20px;
      --radius-md: 12px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-soft: cubic-bezier(0.33, 0.1, 0.25, 1);
      --dur-fast: 220ms;
      --dur-mid: 380ms;
      --dur-slow: 620ms;
      --dur-enter: 780ms;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      min-width: 1100px;
      color: var(--color-ink);
      /* 与 /personal/task 的 .workbench 浅色底完全一致 */
      background: transparent;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 氛围层：光斑 + 淡网格（参数与 PersonalWorkbench .atmosphere 一致） ---- */
    .atmosphere { pointer-events: none; position: fixed; inset: 0; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(44px); opacity: 0.75; animation: float-orb 16s ease-in-out infinite; }
    .orb-a { width: 340px; height: 340px; top: 6%; left: -5%; background: radial-gradient(circle, rgba(46, 196, 214, 0.38), transparent 70%); }
    .orb-b { width: 280px; height: 280px; top: 10%; right: -3%; background: radial-gradient(circle, rgba(201, 168, 108, 0.3), transparent 70%); animation-duration: 19s; animation-delay: -5s; }
    .orb-c { width: 400px; height: 240px; bottom: 4%; left: 26%; background: radial-gradient(circle, rgba(26, 122, 146, 0.2), transparent 70%); animation-duration: 22s; animation-delay: -9s; }
    .grid-layer {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(20, 40, 58, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 40, 58, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 78% 68% at 50% 26%, black, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 78% 68% at 50% 26%, black, transparent 78%);
      animation: grid-drift 32s linear infinite;
      opacity: 0.8;
    }
    @keyframes float-orb {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(10px, -14px, 0) scale(1.03); }
    }
    @keyframes grid-drift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 56px 56px, 56px 56px; }
    }
    @keyframes page-rise {
      from { opacity: 0; transform: translate3d(0, 12px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes soft-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes live-pulse {
      70% { box-shadow: 0 0 0 8px rgba(46, 196, 214, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 196, 214, 0); }
    }
    @keyframes blink { 50% { opacity: 0.25; } }

    /* ---- 细滚动条（与工作台一致） ---- */
    body, .messages, .doc-body, .expert-detail { scrollbar-width: thin; scrollbar-color: rgba(46, 196, 214, 0.22) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(90, 128, 148, 0.28); border-radius: 999px;
      border: 1px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(46, 196, 214, 0.45); }

    /* ===================== 外壳与顶栏（对齐 /personal/task topbar） ===================== */
    .shell {
      position: relative; z-index: 1;
      height: 100%; display: flex; flex-direction: column; gap: 12px;
      padding: 16px 22px 20px; max-width: 1680px; margin: 0 auto;
      animation: page-rise var(--dur-enter) var(--ease-out) 120ms both;
    }
    .topbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; flex-shrink: 0; }
    .back {
      display: inline-flex; align-items: baseline; gap: 8px;
      border: 1px solid rgba(20, 40, 58, 0.12); background: rgba(255, 255, 255, 0.62);
      border-radius: 999px; padding: 7px 16px; cursor: pointer; color: var(--color-ink);
      transition: background 160ms ease, border-color 160ms ease;
    }
    .back:hover { background: rgba(255, 255, 255, 0.9); border-color: rgba(46, 196, 214, 0.35); }
    .back-mark {
      font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em;
      background: linear-gradient(125deg, var(--color-abyss) 8%, #1a7a92 46%, var(--color-signal) 72%, var(--color-brass) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .back-hint { font-size: 0.74rem; color: var(--color-ink-muted); }
    .top-meta { min-width: 0; }
    .top-meta .kind { display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-accent); margin-bottom: 4px; }
    .top-meta h1 {
      margin: 0; font-family: var(--font-display);
      font-size: clamp(1.05rem, 1.8vw, 1.3rem); font-weight: 600;
      color: var(--color-ink); letter-spacing: 0.02em;
    }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .stat-chip {
      display: inline-flex; align-items: baseline; gap: 5px;
      padding: 6px 12px; border-radius: 10px;
      border: 1px solid rgba(20, 40, 58, 0.1); background: rgba(255, 255, 255, 0.7);
    }
    .stat-chip b { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; color: var(--color-accent); min-width: 2.2em; text-align: right; }
    .stat-chip i { font-style: normal; font-size: 0.7rem; color: var(--color-ink-muted); }

    /* ===================== 布局：初始单栏对话，正文生成后切换左右双栏 ===================== */
    .work-grid {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      transition: grid-template-columns var(--dur-slow) var(--ease-soft);
    }
    .work-grid .doc-col { display: none; }
    .work-grid.split { grid-template-columns: minmax(400px, 0.9fr) minmax(0, 1.1fr); }
    .work-grid.split .doc-col { display: flex; }
    .dialog {
      display: flex; flex-direction: column; min-height: 0; min-width: 0;
      border-radius: calc(var(--radius-lg) + 2px);
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.78), rgba(240, 248, 252, 0.52)),
        rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      overflow: hidden;
      animation: page-rise var(--dur-slow) var(--ease-out) both;
    }
    .dialog-head {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;
      gap: 12px 18px; padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(20, 40, 58, 0.08); flex-shrink: 0;
    }
    .dialog-title { min-width: 0; }
    .eyebrow { margin: 0 0 4px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-accent); letter-spacing: 0.14em; }
    .dialog-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--color-ink); }
    .hint { margin: 6px 0 0; font-size: 0.84rem; color: var(--color-ink-muted); }
    .orch { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .orch label { display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; color: var(--color-ink-muted); }
    .orch select {
      min-width: 110px; border-radius: 8px;
      border: 1px solid rgba(20, 40, 58, 0.12); background: rgba(255, 255, 255, 0.7);
      padding: 6px 8px; font-size: 0.82rem; color: var(--color-ink);
    }

    /* ===================== 左栏：历史对话 ===================== */
    .messages {
      flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto;
      overscroll-behavior: contain; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .bubble {
      max-width: 92%; padding: 12px 14px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(20, 40, 58, 0.08);
      color: var(--color-ink); animation: page-rise 0.45s var(--ease-out) both;
    }
    .bubble[data-role='assistant'] { align-self: stretch; max-width: 100%; color: #14304a; background: rgba(255, 255, 255, 0.94); }
    .bubble[data-role='user'] {
      align-self: flex-end; background: rgba(46, 196, 214, 0.14);
      border-color: rgba(46, 196, 214, 0.22); color: var(--color-ink);
    }
    .bubble[data-role='system'] {
      align-self: stretch; max-width: 100%; background: rgba(6, 20, 31, 0.03);
      color: var(--color-ink-muted); font-size: 0.9rem;
    }
    .bubble-meta { margin-bottom: 6px; font-family: var(--font-mono); font-size: 0.68rem; color: var(--color-ink-muted); }
    .bubble-meta .who-xz { color: var(--color-ink-muted); }
    .plain { margin: 0; white-space: pre-wrap; line-height: 1.55; font-size: 0.92rem; color: var(--color-ink); }
    .plain.muted { color: var(--color-ink-muted); }
    .plain .hl { color: var(--color-accent); font-weight: 600; }
    .bubble.typing-bubble .plain::after {
      content: ''; display: inline-block; width: 1em; margin-left: 4px;
      animation: dots 1.2s steps(3, end) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }

    /* ---- 多专家协同过程卡（对齐 PersonalCollabProcess 浅色玻璃样式） ---- */
    .process {
      margin: 0 0 10px; border-radius: 12px;
      border: 1px solid rgba(26, 122, 146, 0.22);
      background: linear-gradient(160deg, rgba(46, 196, 214, 0.08), rgba(255, 255, 255, 0.55));
      overflow: hidden;
    }
    .process[data-done='1'] { border-color: rgba(20, 40, 58, 0.1); background: rgba(6, 20, 31, 0.03); }
    .process-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 12px; border: 0; background: transparent;
      cursor: pointer; color: inherit; text-align: left;
    }
    .toggle-left, .toggle-right { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: rgba(20, 40, 58, 0.25); flex-shrink: 0; }
    .pulse.live { background: var(--color-accent); box-shadow: 0 0 0 0 rgba(46, 196, 214, 0.45); animation: live-pulse 1.4s ease-out infinite; }
    .toggle-left strong { font-size: 0.88rem; color: #14304a; }
    .toggle-left em {
      font-style: normal; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em;
      padding: 2px 7px; border-radius: 999px; color: var(--color-accent);
      background: rgba(46, 196, 214, 0.12); border: 1px solid rgba(46, 196, 214, 0.25);
    }
    .process[data-done='1'] .toggle-left em { color: var(--color-ink-muted); background: rgba(20, 40, 58, 0.05); border-color: rgba(20, 40, 58, 0.1); }
    .count { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-ink-muted); }
    .chevron { font-size: 0.78rem; color: var(--color-accent); }
    .collapsed-hint {
      margin: 0; padding: 0 12px 10px; font-size: 0.82rem; line-height: 1.45;
      color: var(--color-ink-muted); display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .process-body { padding: 0 12px 12px; border-top: 1px solid rgba(20, 40, 58, 0.06); }
    .experts { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .expert {
      border-radius: 10px; border: 1px solid rgba(20, 40, 58, 0.08);
      background: rgba(255, 255, 255, 0.72); overflow: hidden;
    }
    .expert[data-status='running'] { border-color: rgba(46, 196, 214, 0.35); }
    .expert[data-status='done'] { border-color: rgba(26, 122, 146, 0.2); }
    .expert-top {
      width: 100%; display: grid; grid-template-columns: auto 1fr auto auto;
      gap: 8px; align-items: center; padding: 8px 10px; border: 0;
      background: transparent; cursor: pointer; text-align: left; color: inherit;
    }
    .step-no {
      width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%;
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600;
      color: var(--color-ink-muted); background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(20, 40, 58, 0.08); flex-shrink: 0;
    }
    .expert[data-status='running'] .step-no {
      color: var(--color-accent); background: rgba(26, 122, 146, 0.1); border-color: rgba(46, 196, 214, 0.28);
    }
    .expert[data-status='done'] .step-no {
      color: #1a7a5c; background: rgba(26, 122, 92, 0.08); border-color: rgba(26, 122, 92, 0.22);
    }
    .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .meta strong { font-size: 0.86rem; color: #14304a; }
    .meta em {
      font-style: normal; font-size: 0.72rem; color: var(--color-ink-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge {
      font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.04em;
      padding: 2px 7px; border-radius: 6px; color: var(--color-ink-muted);
      background: rgba(20, 40, 58, 0.04); border: 1px solid rgba(20, 40, 58, 0.08);
    }
    .expert[data-status='running'] .badge { color: var(--color-accent); background: rgba(26, 122, 146, 0.1); border-color: rgba(46, 196, 214, 0.28); }
    .expert[data-status='done'] .badge { color: #1a7a5c; background: rgba(26, 122, 92, 0.08); border-color: rgba(26, 122, 92, 0.22); }
    .exp-chevron { font-size: 0.78rem; color: var(--color-ink-muted); }
    .expert-detail { padding: 0 10px 10px; border-top: 1px dashed rgba(20, 40, 58, 0.08); }
    .objective { margin: 8px 0 0; font-size: 0.8rem; line-height: 1.45; color: var(--color-ink-muted); }
    .exp-avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; font-weight: 600; color: #fff; background: #1a7a92; flex-shrink: 0; box-shadow: 0 2px 6px rgba(6, 20, 31, 0.18); }
    .dispatch-note { margin: 8px 0 0; font-size: 0.76rem; line-height: 1.55; color: var(--color-accent); font-family: var(--font-mono); }
    .mat-src { font-family: var(--font-mono); font-size: 0.6rem; color: var(--color-ink-muted); border: 1px solid rgba(20, 40, 58, 0.1); border-radius: 999px; padding: 1px 6px; background: rgba(255, 255, 255, 0.7); flex-shrink: 0; }
    .bubble-meta .who-exp { display: inline-flex; align-items: center; gap: 6px; color: var(--color-ink); font-weight: 600; font-family: var(--font-body); font-size: 0.74rem; }
    .bubble-meta .who-exp i { font-style: normal; padding: 1px 7px; border-radius: 999px; font-size: 0.62rem; color: #fff; }

    /* ---- 阶段中间产物（对话内展示） ---- */
    .mat-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .mat-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 9px; border-radius: 9px;
      background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(20, 40, 58, 0.08);
      opacity: 0; transform: translateX(-10px);
      transition: opacity 0.35s ease, transform 0.35s var(--ease-out), border-color 0.3s ease;
    }
    .mat-row.show { opacity: 1; transform: translateX(0); }
    .mat-row.matched { border-color: rgba(46, 196, 214, 0.42); }
    .mat-ico { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(46, 196, 214, 0.12); flex-shrink: 0; }
    .mat-ico svg { width: 12px; height: 12px; }
    .mat-name { flex: 1; min-width: 0; font-size: 0.76rem; font-weight: 600; color: #14304a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mat-meta { font-family: var(--font-mono); font-size: 0.62rem; color: var(--color-ink-muted); flex-shrink: 0; }
    .mat-check { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: rgba(26, 122, 92, 0.12); opacity: 0; transform: scale(0.5); transition: all 0.3s var(--ease-out); flex-shrink: 0; }
    .mat-check svg { width: 9px; height: 9px; color: #1a7a5c; }
    .mat-row.matched .mat-check { opacity: 1; transform: scale(1); }
    .dim-line { margin-top: 8px; font-size: 0.76rem; color: var(--color-ink-muted); line-height: 1.6; }
    .dim-line strong { color: var(--color-accent); font-family: var(--font-mono); }

    .ol-tree { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
    .ol-line { font-size: 0.78rem; padding: 3px 7px; border-radius: 6px; opacity: 0; transform: translateY(5px); transition: opacity 0.35s ease, transform 0.35s var(--ease-out); }
    .ol-line.show { opacity: 1; transform: translateY(0); }
    .ol-line.l1 { font-family: var(--font-display); font-weight: 600; color: #14304a; border-left: 3px solid var(--color-brass); background: rgba(201, 168, 108, 0.12); }
    .ol-line.l2 { margin-left: 18px; color: var(--color-accent); }
    .ol-line.l3 { margin-left: 36px; color: var(--color-ink-muted); font-size: 0.72rem; }
    .ol-tag {
      display: none; margin-left: 7px; padding: 1px 7px; border-radius: 999px;
      font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.05em;
      color: var(--color-accent); background: rgba(46, 196, 214, 0.12); border: 1px solid rgba(46, 196, 214, 0.25);
    }
    .ol-tag.show { display: inline-block; animation: soft-fade 0.4s ease both; }

    .typing-note { margin-top: 8px; font-family: var(--font-mono); font-size: 0.74rem; color: var(--color-accent); }
    .typing-note .cursor { display: inline-block; width: 2px; height: 0.9em; vertical-align: -1px; background: var(--color-accent); animation: blink 0.9s step-end infinite; }

    .vf-list { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .vf-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 9px;
      background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(20, 40, 58, 0.08);
      opacity: 0; transform: translateY(5px);
      transition: opacity 0.35s ease, transform 0.35s var(--ease-out), border-color 0.35s ease;
    }
    .vf-row.show { opacity: 1; transform: translateY(0); }
    .vf-row.pass { border-color: rgba(26, 122, 92, 0.28); }
    .vf-ico { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: rgba(26, 122, 92, 0.1); color: #1a7a5c; flex-shrink: 0; }
    .vf-ico svg { width: 10px; height: 10px; }
    .vf-text { flex: 1; font-size: 0.74rem; color: #14304a; }
    .vf-status { font-family: var(--font-mono); font-size: 0.64rem; color: #b87a35; letter-spacing: 0.04em; }
    .vf-row.pass .vf-status { color: #1a7a5c; }

    /* ---- 生成成果卡（对话内） ---- */
    .report-card {
      margin-top: 10px; padding: 13px 15px; border-radius: 13px;
      background: linear-gradient(145deg, rgba(201, 168, 108, 0.16), rgba(46, 196, 214, 0.1));
      border: 1px solid rgba(201, 168, 108, 0.5);
      animation: page-rise 0.5s var(--ease-out) both;
    }
    .rc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .rc-head strong { font-size: 0.84rem; letter-spacing: 0.08em; color: #8a6a2e; font-family: var(--font-display); }
    .rc-head em { font-style: normal; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; color: var(--color-accent); }
    .rc-title { font-size: 0.95rem; font-weight: 600; color: var(--color-ink); margin-bottom: 4px; font-family: var(--font-display); }
    .rc-meta { font-size: 0.72rem; color: var(--color-ink-muted); font-family: var(--font-mono); margin-bottom: 10px; }
    .rc-actions { display: flex; gap: 8px; }
    .rc-actions button {
      border: 1px solid rgba(20, 40, 58, 0.12); background: rgba(255, 255, 255, 0.78);

          return obj;
        });
    }

    function createProcess() {
      const bubble = xzSay('');
      bubble.querySelector('.plain').innerHTML = '收到指示。本次报告由<span class="hl">工作总结专家</span>统筹：调度各组组长推送总结材料，再交<span class="hl">报告写作专家</span>提纲拟稿与撰写，协同过程如下：';

      root.dataset.open = '1';
      root.dataset.done = '0';
      root.innerHTML = `
        <button type="button" class="process-toggle">
          <span class="toggle-left"><span class="pulse live"></span><strong>小智 · 多专家协同过程</strong><em class="phase">准备中</em></span>

        </button>

        <div class="process-body"><ol class="experts"></ol></div>`;
      const list = root.querySelector('.experts');
      const steps = STEP_DEFS.map((d, i) => {
        const li = document.createElement('li');
        li.className = 'expert';
        li.dataset.status = 'queued';
        li.innerHTML = `
          <button type="button" class="expert-top">
            <span class="exp-avatar" style="background:${EXPERTS[d.exp].color}">${EXPERTS[d.exp].mark}</span>
            <span class="meta"><strong>${d.name}</strong><em>${d.title}</em></span>

            <span class="exp-chevron">▸</span>

          <div class="expert-detail" hidden><p class="objective">${d.desc}</p></div>`;
        const detail = li.querySelector('.expert-detail');
        const chevron = li.querySelector('.exp-chevron');
        li.querySelector('.expert-top').addEventListener('click', () => {
          detail.hidden = !detail.hidden;
          chevron.textContent = detail.hidden ? '▸' : '▾';
        });
        list.appendChild(li);
        return { li, detail, chevron, badge: li.querySelector('.badge') };
      });

      let manualOpen = null;
      const toggleEl = root.querySelector('.process-toggle');
      const bodyEl = root.querySelector('.process-body');
      const hintEl = root.querySelector('.collapsed-hint');
      const applyOpen = () => {
        const open = manualOpen === null ? root.dataset.done !== '1' : manualOpen;
        root.dataset.open = open ? '1' : '0';
        bodyEl.style.display = open ? '' : 'none';
        hintEl.hidden = open;
        toggleEl.querySelector('.chevron').textContent = open ? '收起' : '展开';
      };
      toggleEl.addEventListener('click', () => { manualOpen = root.dataset.open !== '1'; applyOpen(); });

      bubble.insertBefore(root, bubble.querySelector('.plain').nextSibling);
      proc = {
        root, steps, applyOpen,
        phaseEl: root.querySelector('.phase'),
        countEl: root.querySelector('.count'),
        pulseEl: root.querySelector('.pulse'),
        hintEl,
      };
      scrollChat();
    }

    function setPhase(text) { if (proc) proc.phaseEl.textContent = text; }

      const doneCount = proc.steps.filter(x => x.li.dataset.status === 'done').length;
      proc.countEl.textContent = `${doneCount}/${STEP_DEFS.length}`;

    // ===================== 协同阶段动画（中间产物在对话内过程卡中展示） =====================
    async function animateStage0Dispatch() {
      // 工作总结专家统筹调度 → 各组组长逐一推送材料 → 汇总匹配
      setPhase('工作总结专家 · 调度中');
      setStepStatus(0, 'running');
      const chiefDetail = proc.steps[0].detail;
      const dispatch = document.createElement('p');
      dispatch.className = 'dispatch-note';
      dispatch.innerHTML = `▸ 已向 <strong>${LEADER_ORDER.length}</strong> 位组组长发出指令：请推送本组 2026 年度总结材料`;

      let received = 0;
      for (let li = 0; li < LEADER_ORDER.length; li++) {

        const stepIdx = 1 + li;
        const mats = materialsOf(key);

        setStepStatus(stepIdx, 'running');

        for (const m of mats) {
          const row = document.createElement('div');

          row.classList.add('show');
          await sleep(190);
          row.classList.add('matched');
          received++;
          $('statMat').textContent = String(received);
          await sleep(100);

        if (!mats.length) list.innerHTML = '<p class="dim-line">本组暂无待推送材料</p>';

    async function animateStage2Draft() {
      setPhase('报告写作专家 · 报告撰写');
      setStepStatus(6, 'running');
      const detail = proc.steps[6].detail;
      const note = document.createElement('p');
      note.className = 'typing-note';
      note.innerHTML = '正在右侧预览区逐段撰写正文… <span class="cnt">0</span> 字<span class="cursor"></span>';
      detail.appendChild(note);
      beginDocSkeleton();
      const typed = $('docTyped');
      const cursor = document.createElement('span');
      cursor.className = 'typing-cursor';
      let totalChars = 0;
      const CHAR_INTERVAL = 16;
      for (const para of draftParagraphs) {
        const h = document.createElement('h4');
        h.textContent = para.heading;
        typed.appendChild(h);
        await sleep(110);
        const p = document.createElement('p');
        typed.appendChild(p);
        p.appendChild(cursor);
        const chars = para.body.split('');
        let buf = '';
        for (let ci = 0; ci < chars.length; ci++) {
          buf += chars[ci];
          totalChars++;
          if (buf.length >= 6 || ci === chars.length - 1) {
            cursor.before(document.createTextNode(buf));
            buf = '';
            $('statWords').textContent = String(totalChars);
            note.querySelector('.cnt').textContent = String(totalChars);
            docBody.scrollTop = docBody.scrollHeight;
          }
          if (ci % 4 === 0) await sleep(CHAR_INTERVAL * 4);
        }
        cursor.remove();
        await sleep(240);
      }
      note.innerHTML = `初稿完成 · 共 <span class="cnt">${totalChars}</span> 字，提交工作总结专家校核…`;
      setStepStatus(6, 'done');
      return totalChars;
    }

        rc.className = 'report-card';
        rc.innerHTML = `
          <div class="rc-head"><strong>生成成果</strong><em>协同完成</em></div>
          <div class="rc-title">${m.title || '总结报告'}</div>
          <div class="rc-meta">工作总结专家 统筹 · 报告写作专家 撰写 · ${materials.length} 份素材 / ${LEADER_ORDER.length} 个组 · 全文 ${m.totalWords || totalChars} 字 · ${verifyItems.length} 项校核通过</div>
          <div class="rc-actions">
            <button type="button" data-act="view">查看正文</button>
            <button type="button" class="gold" data-act="pdf">导出 PDF</button>
          </div>`;
        card.appendChild(rc);
        rc.querySelector('[data-act="view"]').addEventListener('click', focusDoc);
        rc.querySelector('[data-act="pdf"]').addEventListener('click', () => exportPdfViaPrint());
        scrollChat();
        // 正文沉淀至档案馆，提供跳转
        await sleep(280);
        const ab = xzSay(`本次生成的<span class="hl">《${m.title || '总结报告'}》</span>已自动沉淀至「档案馆」，与历史归档材料统一管理，可随时回溯与再次导出。`);
        ab.querySelector('.plain').appendChild(makeArchiveLink());
        scrollChat();
      } catch (err) {
        xzSay(`生成过程中出现异常：${err.message || err}`);
      } finally {
        setRunningUi(false);
      }
    }

    // ===================== 快捷指令 / 运行态 UI =====================
    function renderShortcuts() {
      const chips = state.done
        ? [{ text: CHIP_AGAIN, gold: true }, { text: '查看正文' }, { text: '导出 PDF' }]
        : [{ text: CHIP_MAIN, gold: true, hint: true }];
      shortcutsEl.innerHTML = '';
      chips.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'picker-btn' + (c.gold ? ' chip-gold' : '');
        btn.textContent = c.text;
        btn.disabled = state.running;
        if (c.hint && !state.running) btn.classList.add('pulse-hint');
        btn.addEventListener('click', () => handleSend(c.text));
        shortcutsEl.appendChild(btn);
      });
    }

    function setRunningUi(running) {
      state.running = running;
      draftInput.disabled = running;
      sendBtn.disabled = running || !draftInput.value.trim();
      $('selTeam').disabled = running;
      $('selWorkflow').disabled = running;
      $('selMode').disabled = running;
      headStatus.textContent = running
        ? '小智正在生成总结报告，请稍候…'
        : (state.done ? '报告已生成并沉淀至档案馆，可预览正文、导出 PDF 或前往档案馆。' : '点击指令或直接输入，小智即刻开始生成总结报告。');
      renderShortcuts();
    }

    // ===================== 意图路由（纯对话驱动） =====================
    async function handleSend(raw) {
      const text = (raw || '').trim();
      if (!text || state.running) return;
      userSay(text);
      draftInput.value = '';
      sendBtn.disabled = true;

      if (/重新|再来|再生成|重做/.test(text)) {
        await xzThinkThen('好的，正在重新启动<span class="hl">完整生成流程</span>，历史对话会保留，右侧正文将更新为新版…', 600);
        await runFullFlow();
        return;
      }
      if (/(生成|总结|报告)/.test(text)) {
        await xzThinkThen('收到指示。工作总结专家将统筹调度各组组长推送材料，报告写作专家负责撰写，协同过程在对话中展开，正文实时同步到右侧预览。', 800);
        await runFullFlow();
        return;
      }
      if (/导出|下载|pdf|PDF/.test(text)) {
        if (state.done) {
          await xzThinkThen('正在打开打印导出窗口，可在系统对话框中选择<span class="hl">“另存为 PDF”</span>。', 400);
          exportPdfViaPrint();
        } else {
          await xzThinkThen('报告尚未生成。点击指令「当前任务已完成，请生成一份总结报告」即可开始。', 400);
        }
        return;
      }
      if (/查看|预览|正文/.test(text)) {
        if (state.done) {
          await xzThinkThen('已为您定位到右侧<span class="hl">正文预览</span>。', 350);
          focusDoc();
        } else {
          await xzThinkThen('正文还未生成，请先让小智启动生成流程。', 350);
        }
        return;
      }
      if (/档案|归档|回溯|沉淀/.test(text)) {
        const b = await xzThinkThen(state.done
          ? '本次正文已沉淀至<span class="hl">档案馆</span>，点击下方按钮即可跳转查看。'
          : '报告生成完成后会自动沉淀至<span class="hl">档案馆</span>，届时可点击跳转查看。', 500);
        b.querySelector('.plain').appendChild(makeArchiveLink());
        return;
      }
      await xzThinkThen('这个问题小智先记下了。当前工作台专注总结报告生成——点击下方指令即可一键开始。', 600);
    }

    // ===================== PDF 导出（浏览器打印 → 另存为 PDF） =====================
    function exportPdfViaPrint() {
      const m = metaData;
      const bodyHTML = `
        <div style="font-family:'华文中宋',SimSun,serif;font-size:26pt;color:#e00000;letter-spacing:0.15em;font-weight:bold;text-align:center;margin-bottom:0.3cm;">${m.orgName||''}</div>
        <div style="font-family:'方正小标宋','华文中宋',SimSun,serif;font-size:22pt;text-align:center;letter-spacing:0.1em;margin-bottom:0.1cm;">${m.docType||''}</div>
        <div style="height:2px;background:#e00000;margin:0.2cm 0 0.5cm;"></div>
        <div style="font-size:16pt;text-align:center;margin-bottom:0.6cm;">${m.docNumber||''}</div>
        <div style="font-family:'方正小标宋','华文中宋',SimSun,serif;font-size:22pt;font-weight:bold;text-align:center;line-height:36pt;margin-bottom:0.5cm;">${m.title||''}</div>
        <div style="font-size:16pt;margin-bottom:0.3cm;">${m.recipient||''}：</div>
        ${finalParagraphs.map(p=>`<h4 style="font-family:'黑体',SimHei,sans-serif;font-size:16pt;font-weight:bold;text-indent:2em;line-height:28pt;margin:0.3cm 0 0.1cm 0;">${p.heading.replace(/<[^>]*>/g,'')}</h4><p style="text-indent:2em;text-align:justify;line-height:28pt;margin:0;">${p.body}</p>`).join('')}
        <p style="text-indent:2em;line-height:28pt;margin-top:0.5cm;">特此报告。</p>
        <div style="text-align:right;margin-top:1cm;font-size:16pt;line-height:28pt;"><p style="margin:0;text-indent:0;">${m.signatureOrg||''}</p><p style="margin:0;text-indent:0;">${m.signatureDate||''}</p></div>
        <div style="margin-top:1cm;border-top:1px solid #000;padding-top:0.1cm;font-size:10pt;color:#333;display:flex;justify-content:space-between;"><span>${m.footerLeft||''}</span><span>${m.footerRight||''}</span></div>`;
      const printWin = window.open('', '_blank', 'width=800,height=900');
      if (!printWin) { alert('请允许弹出窗口以导出 PDF'); return; }
      printWin.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${m.title||'文档'}</title>
        <style>
          @page { size: A4; margin: 3.7cm 2.6cm 3.5cm 2.8cm; }
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: '仿宋', FangSong, '仿宋_GB2312', serif; font-size: 16pt; line-height: 28pt; color: #000; }
          .data-highlight { font-family: '黑体', SimHei, sans-serif; font-weight: bold; }
        </style></head><body>${bodyHTML}</body></html>`);
      printWin.document.close();
      printWin.onload = () => {
        setTimeout(() => { printWin.focus(); printWin.print(); printWin.close(); }, 500);
      };
    }

    // ===================== 事件绑定 =====================
    composer.addEventListener('submit', e => { e.preventDefault(); handleSend(draftInput.value); });
    draftInput.addEventListener('input', () => {
      sendBtn.disabled = state.running || !draftInput.value.trim();
    });
    draftInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend(draftInput.value);
      }
    });
    $('btnExportPdf2').addEventListener('click', () => { if (state.done && !state.running) exportPdfViaPrint(); });
    $('btnRegen').addEventListener('click', () => { if (!state.running) handleSend('重新生成总结报告'); });
    $('backBtn').addEventListener('click', () => {
      // 应用内嵌（/command/task）时回到高总工作台首页；独立打开时走浏览器历史
      if (window.top !== window.self) { window.top.location.href = '/command'; return; }
      if (history.length > 1) history.back();
    });

    // ===================== 启动 =====================
    async function init() {
      clearDoc();
      renderShortcuts();
      await loadData();
      sysSay('已进入工作台「总结材料生成」。确认指令后点击发送，小智即刻开始执行。');
      await sleep(500);
      xzSay('领导好，我是小智。本次专项任务已经完成，相关过程素材（会议纪要、部署方案、评审与数据报告等）均已归档。');
      await sleep(900);
      xzSay('如需形成正式总结材料，点击下方指令，或直接对我说「生成总结报告」。<span class="hl">工作总结专家</span>将统筹调度各组组长推送总结材料，<span class="hl">报告写作专家</span>负责提纲与撰写，经数据校核后生成终稿，进入正文生成后会自动展开右侧预览区。');
      // 工作台首页输入的对话通过 ?q= 透传进来，自动作为首条指令执行
      const qParam = new URLSearchParams(location.search).get('q');
      if (qParam) { await sleep(600); handleSend(qParam); };
    }
    init();
  </script>
</body>
</html>
