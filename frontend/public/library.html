<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识体系档案馆</title>
  <style>
    :root {
      --font-body:'Sora','PingFang SC','Microsoft YaHei',sans-serif;
      --font-display:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
      --font-mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
      --cyan:#4dd9e8; --green:#4ae8a0; --amber:#e8c94a; --purple:#b44ae8; --red:#e84a6a; --blue:#4a9de8;
      --accent:#1a7a92; --signal:#2ec4d6; --brass:#c9a86c;
      --text:#eef2f7; --muted:#5a7084; --ink:#14283a;
      --kraft1:#c9a877; --kraft2:#b08e5e; --kraft3:#96754a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font-body);color:var(--ink);background:radial-gradient(1200px 620px at 6% -10%,rgba(46,196,214,0.2),transparent 58%),radial-gradient(920px 540px at 96% 0%,rgba(201,168,108,0.14),transparent 50%),radial-gradient(780px 420px at 48% 110%,rgba(26,122,146,0.14),transparent 55%),linear-gradient(168deg,#c5d8e6 0%,#e7f0f6 42%,#eef4f8 78%,#e9eef3 100%);background-attachment:fixed;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(26,122,146,.35) transparent}
    body::-webkit-scrollbar{width:8px}
    body::-webkit-scrollbar-track{background:transparent}
    body::-webkit-scrollbar-thumb{background:rgba(26,122,146,.3);border-radius:4px}
    body::-webkit-scrollbar-thumb:hover{background:rgba(26,122,146,.52)}

    .lib-header{position:fixed;top:0;left:0;right:0;height:3.5rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(240,248,252,.52));backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid rgba(255,255,255,.72);box-shadow:0 22px 56px rgba(6,20,31,.14);z-index:50}
    .header-left{display:flex;align-items:center;gap:.75rem}
    .header-accent{width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--signal),#3a7bd5);box-shadow:0 0 12px rgba(46,196,214,.5)}
    .header-title{font-family:var(--font-display);font-size:1.3rem;font-weight:600;letter-spacing:.05em;color:var(--ink)}
    .header-right{display:flex;align-items:center;gap:1.25rem}
    .breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:#5a7084}
    .bc-item{cursor:pointer;transition:color .2s}.bc-item:hover{color:var(--accent)}.bc-item.active{color:var(--accent);font-weight:600}
    .bc-sep{opacity:.4}
    .nav-btns{display:flex;gap:.4rem}
    .nav-btn{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(20,40,58,.12);border-radius:999px;background:rgba(255,255,255,.62);color:var(--accent);cursor:pointer;transition:all .2s ease}
    .nav-btn:hover:not(:disabled){background:rgba(255,255,255,.9);border-color:rgba(46,196,214,.35)}
    .nav-btn:active:not(:disabled){transform:scale(.92)}
    .nav-btn:disabled{opacity:.4;cursor:not-allowed;color:#8fa3b8;border-color:rgba(20,40,58,.08);background:transparent;box-shadow:none}
    .nav-btn svg{width:14px;height:14px}

    .view{display:none;padding:3.5rem 0 2.4rem}
    .view.hidden{display:none!important}
    .view:not(.hidden){display:block;animation:viewIn .45s ease}
    #viewPages:not(.hidden){display:flex}
    @keyframes viewIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

    /* ============ 第一层：书架 + 书本（三行两列网格） ============ */
    #viewShelf{padding:140px 2rem 24px}
    /* 书架容器（2列 × 3行网格） */
    .shelf-unit{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:26px 30px;padding:0;position:relative}
    /* 书架格（每格一个类别） */
    .shelf-row{position:relative;display:flex;align-items:stretch;padding:0;margin-bottom:0;min-height:340px;border-bottom:24px solid #f2f6f4;background:rgba(255,255,255,.4);border-radius:8px;box-shadow:inset 0 1px 0 rgba(0,30,43,.04),0 0 0 1px rgba(0,30,43,.05)}
    /* 每格底部的木架板 */
    .shelf-row::before{content:'';position:absolute;bottom:-24px;left:10px;right:10px;height:24px;background:linear-gradient(180deg,#dfe8e2 0%,#f2f6f4 100%);border-radius:0 0 8px 8px;box-shadow:0 2px 0 rgba(0,30,43,.04),0 3px 0 rgba(0,30,43,.06),0 6px 14px rgba(0,30,43,.12);z-index:5}
    /* 类别标签（每格左上，横排） */
    .category-title{position:absolute;left:0;top:0;color:#001e2b;font-family:var(--font-display);font-size:.95rem;font-weight:600;letter-spacing:.02em;padding:.35rem .85rem .35rem 1.05rem;background:rgba(255,255,255,.95);border-bottom:2px solid rgba(0,30,43,.1);border-radius:8px 0 8px 0;z-index:10;white-space:nowrap;box-shadow:0 1px 4px rgba(0,30,43,.06)}
    .category-title::before{content:'';position:absolute;left:7px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:#00ed64;box-shadow:0 0 6px rgba(0,237,100,.5)}
    /* 书本容器 */
    .boxes-container{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:36px 10px 20px;flex:1;overflow:visible;flex-wrap:nowrap}
    /* 单本书（统一规格，模拟真实档案盒尺寸） */
    .archive-box{position:relative;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:290px;width:78px}
    .box-badge-new{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:linear-gradient(160deg,#ff5a5a,#d92b2b);color:#fff;font-family:var(--font-display);font-size:1.12rem;font-weight:700;display:grid;place-items:center;border:2px solid rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(217,43,43,.5),inset 0 1px 0 rgba(255,255,255,.4);z-index:30;letter-spacing:.02em}
    .archive-box:hover .box-badge-new{transform:translateX(-50%) translateY(16px)}
    .archive-box:hover{transform:translateY(-16px);z-index:20}
    .archive-box:hover .book-spine{box-shadow:0 0 0 1px rgba(0,30,43,.08),0 4px 8px rgba(0,30,43,.08),0 16px 32px rgba(0,30,43,.16)}
    .archive-box:hover .folder-tooltip{opacity:1;transform:translateX(-50%) translateY(-10px)}
    /* 书脊主体 */
    .book-spine{width:100%;height:100%;background:linear-gradient(180deg,var(--folder-color) 0%,var(--folder-color-dark) 100%);border-radius:5px 5px 0 0;box-shadow:0 0 0 1px rgba(0,30,43,.06),0 2px 6px rgba(0,30,43,.04),0 6px 14px rgba(0,30,43,.1),inset 2px 0 0 rgba(255,255,255,.14),inset -2px 0 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 3px;position:relative;overflow:hidden;transition:box-shadow .35s cubic-bezier(.2,.8,.2,1)}
    /* 书顶/书底装饰线 */
    .book-spine::before{content:'';position:absolute;top:0;left:12%;right:12%;height:4px;background:rgba(255,255,255,.28);border-radius:5px 5px 0 0}
    .book-spine::after{content:'';position:absolute;bottom:0;left:12%;right:12%;height:4px;background:rgba(0,0,0,.18)}
    /* 书名条带（白色标签：统一占档案盒高度 70%） */
    .book-title-band{width:80%;height:70%;background:rgba(255,255,255,.94);border-radius:2px;padding:4px 2px;text-align:center;box-shadow:0 1px 2px rgba(0,30,43,.08),inset 0 0 0 1px rgba(0,30,43,.04);margin:0;display:flex;align-items:center;justify-content:center}
    .folder-label-text{font-size:20px;font-weight:700;font-family:var(--font-display);color:#001e2b;line-height:1.35;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;max-height:100%}
    /* 档案盒拉手孔（底部居中圆形内凹） */
    .book-hole{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,rgba(0,30,43,.36) 0%,rgba(0,30,43,.58) 100%);box-shadow:inset 0 2px 3px rgba(0,30,43,.45),inset 0 -1px 1px rgba(255,255,255,.14),0 1px 0 rgba(255,255,255,.3)}
    /* 装饰横线 */
    .book-line{width:34%;height:3px;background:rgba(255,255,255,.35);border-radius:1px;margin:4px 0}
    /* 悬浮提示 */
    .folder-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(0);background:#001e2b;border-radius:6px;padding:10px 14px;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,30,43,.1),0 2px 6px rgba(0,30,43,.08),0 12px 24px rgba(0,30,43,.18);opacity:0;transition:all .3s;pointer-events:none;z-index:100;font-size:.76rem;color:#f7f8f8;letter-spacing:.01em}
    .folder-tooltip strong{display:block;margin-bottom:3px;font-size:.82rem;font-weight:600;font-family:var(--font-display);color:#00ed64}
    .folder-tooltip small{color:rgba(247,248,248,.65);font-size:.66rem}
    /* 档案盒阴影 */
    .box-shadow{display:none}

    /* 牛皮纸箱 */
    .kbox{width:min(330px,28vw);height:min(250px,24vw);position:relative;perspective:1200px;cursor:pointer;z-index:5;transition:transform .4s cubic-bezier(.34,1.4,.64,1)}
    .kbox:hover{transform:translateY(-10px)}
    .kbox-shadow{position:absolute;bottom:-14px;left:8%;right:8%;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);transition:all .4s;z-index:0}
    .kbox:hover .kbox-shadow{left:13%;right:13%;bottom:-10px;opacity:.7}
    /* 箱内黑暗缝隙 */
    .kbox-inside{position:absolute;top:22px;left:14px;right:14px;height:52px;z-index:1;background:linear-gradient(180deg,#160f07 0%,#2c1e0d 60%,#3a2914 100%);border-radius:4px;box-shadow:inset 0 8px 14px rgba(0,0,0,.75)}
    /* 箱内浮起的彩色文件盒：限制在箱口带内，不覆盖箱体正面 */
    .kbox-peek{position:absolute;top:22px;left:14px;right:14px;height:52px;z-index:2;display:flex;gap:9px;justify-content:center;align-items:flex-end;overflow:hidden;pointer-events:none;padding-bottom:3px}
    .kbox-peek i{width:26px;height:38px;border-radius:3px;background:linear-gradient(180deg,var(--c) 0%,var(--c) 70%,rgba(0,0,0,.35));border-top:3px solid rgba(255,255,255,.35);box-shadow:0 3px 8px rgba(0,0,0,.5);transform:translateY(48px);transition:transform .55s cubic-bezier(.34,1.35,.64,1)}
    .kbox:hover .kbox-peek i{transform:translateY(2px)}
    .kbox-peek i:nth-child(1){transition-delay:.08s}
    .kbox-peek i:nth-child(2){transition-delay:.15s;height:44px}
    .kbox-peek i:nth-child(3){transition-delay:.22s}
    .kbox-peek i:nth-child(4){transition-delay:.29s;height:41px}
    .kbox-peek i:nth-child(5){transition-delay:.36s}
    /* 箱盖：整体上浮，悬浮开启/移开合上 */
    .kbox-lid{position:absolute;top:22px;left:14px;right:14px;height:52px;z-index:5;border-radius:5px;border:1px solid rgba(90,60,25,.55);
      background:linear-gradient(180deg,#c9a878,#ab8752 60%,#9c7a48);
      box-shadow:inset 0 2px 4px rgba(255,240,210,.35),0 5px 12px rgba(0,0,0,.35);
      transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
    .kbox-lid::before{content:'';position:absolute;inset:0;border-radius:5px;opacity:.5;background:repeating-linear-gradient(93deg,transparent,transparent 5px,rgba(120,80,35,.06) 5px,rgba(120,80,35,.06) 6px)}
    .kbox-lid::after{content:'';position:absolute;top:50%;left:32%;right:32%;height:3px;transform:translateY(-50%);border-radius:2px;background:rgba(90,60,25,.3)}
    .kbox:hover .kbox-lid{transform:translateY(-44px) rotateX(-12deg)}
    .kbox.opening .kbox-lid{transform:translateY(-62px) rotateX(-16deg)}
    .kbox.opening .kbox-peek i{transform:translateY(-4px)}
    /* 箱体正面 */
    .kbox-front{position:absolute;top:74px;left:0;right:0;bottom:0;z-index:4;border-radius:3px 3px 8px 8px;border:1px solid rgba(90,60,25,.45);
      background:linear-gradient(168deg,var(--kraft1) 0%,var(--kraft2) 45%,var(--kraft3) 100%);
      box-shadow:inset 0 4px 10px rgba(255,240,210,.18),inset 0 -20px 32px rgba(60,35,10,.28),0 14px 30px rgba(0,0,0,.45);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.9rem 1.2rem;text-align:center}
    .kbox-front::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;
      background:repeating-linear-gradient(93deg,transparent,transparent 5px,rgba(120,80,35,.05) 5px,rgba(120,80,35,.05) 6px)}
    .kbox-cat{font-size:1.22rem;font-weight:800;color:#3a2a12;letter-spacing:.05em;text-shadow:0 1px 0 rgba(255,240,210,.4)}
    .kbox-cat::before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--sc);margin-right:.45rem;box-shadow:0 0 6px var(--sc)}
    .kbox-desc{font-size:.72rem;line-height:1.6;color:#4a3618;border-top:1px dashed rgba(90,60,25,.4);padding-top:.5rem;width:94%}
    .kbox-stamp{position:absolute;top:8px;right:10px;font-size:.58rem;letter-spacing:.16em;color:rgba(150,40,30,.65);border:2px solid rgba(150,40,30,.45);border-radius:4px;padding:2px 5px;transform:rotate(6deg);font-weight:700}
    .kbox-hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.6rem;font-family:var(--font-mono);color:rgba(60,40,15,.55);letter-spacing:.1em}
    .kbox:hover .kbox-hint{color:rgba(60,40,15,.95)}

    /* ============ 第二层：俯视箱内 · 文件盒侧面（书脊） ============ */
    #viewFilebox{display:flex;align-items:center;justify-content:center}
    .fb-scene{width:min(1360px,96vw);perspective:1500px}
    .fb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
    .fb-title{font-size:1.15rem;font-weight:600;font-family:var(--font-display)}
    .fb-title small{display:block;font-size:.75rem;color:var(--muted);font-weight:400;margin-top:.25rem;max-width:660px;line-height:1.5}
    .back-btn{padding:.5rem 1rem;border:1px solid rgba(20,40,58,.12);border-radius:999px;background:rgba(255,255,255,.62);color:var(--accent);cursor:pointer;font-size:.8125rem;transition:all .2s;white-space:nowrap}
    .back-btn:hover{background:rgba(255,255,255,.9);border-color:rgba(46,196,214,.35)}
    .fb-title:hover{color:inherit}
    /* 俯视平面：保持俯角不变的淡入上浮入场（避免 3D 面展开拖动） */
    .td-plane{transform:rotateX(18deg);transform-style:preserve-3d;animation:camIn .55s ease}
    @keyframes camIn{0%{opacity:0;transform:rotateX(18deg) scale(.94) translateY(3.5vh)}100%{opacity:1;transform:rotateX(18deg) scale(1) translateY(0)}}
    .td-box{position:relative;width:min(1240px,95vw);height:min(600px,60vh);margin:0 auto;transform-style:preserve-3d}
    /* 箱壁（牛皮纸框） */
    .td-walls{position:absolute;inset:0;border-radius:14px;border:42px solid #a8834f;background:#a8834f;box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(80,52,20,.5)}
    .td-walls::before{content:'';position:absolute;inset:-42px;border-radius:14px;background:linear-gradient(168deg,#c2a06e,#a5824f 55%,#8a6a3e);z-index:-1}
    .td-walls::after{content:'';position:absolute;inset:-42px;border-radius:14px;pointer-events:none;opacity:.5;background:repeating-linear-gradient(93deg,transparent,transparent 5px,rgba(120,80,35,.06) 5px,rgba(120,80,35,.06) 6px)}
    /* 箱底（内部阴影） */
    .td-bottom{position:absolute;inset:42px;border-radius:6px;background:linear-gradient(180deg,#241a0e,#3a2b18);box-shadow:inset 0 14px 32px rgba(0,0,0,.75);z-index:1}
    /* 向外翻开的箱盖 */
    .td-flap{position:absolute;height:56px;width:72%;z-index:0;background:linear-gradient(180deg,#8f6f45,#a8834f);border:1px solid rgba(90,60,25,.5);opacity:.92}
    .td-flap-n{top:-58px;left:14%;border-radius:6px 6px 0 0;transform-origin:bottom center;transform:rotateX(52deg)}
    .td-flap-s{bottom:-58px;left:14%;border-radius:0 0 6px 6px;transform-origin:top center;transform:rotateX(-52deg)}
    .td-flap-w{left:-58px;top:14%;height:72%;width:52px;border-radius:6px 0 0 6px;transform-origin:right center;transform:rotateY(-52deg);background:linear-gradient(90deg,#8f6f45,#a8834f)}
    .td-flap-e{right:-58px;top:14%;height:72%;width:52px;border-radius:0 6px 6px 0;transform-origin:left center;transform:rotateY(52deg);background:linear-gradient(90deg,#a8834f,#8f6f45)}
    /* 文件盒书脊排（立体文件盒：正面+顶面+两侧+背面） */
    .td-inner{position:absolute;inset:42px;z-index:2;display:flex;gap:26px;justify-content:center;align-items:flex-end;padding:26px 44px 30px;transform-style:preserve-3d}
    .spine{position:relative;width:clamp(72px,8vw,106px);height:100%;transform-style:preserve-3d;cursor:pointer;
      transition:transform .38s cubic-bezier(.34,1.4,.64,1)}
    .s3d{position:absolute;backface-visibility:hidden}
    /* 正面（书脊面） */
    .s3d-front{inset:0;border-radius:4px 4px 2px 2px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;gap:8px;transform:translateZ(22px);
      background:linear-gradient(90deg,var(--fc-lo) 0%,var(--fc) 30%,var(--fc-hi) 52%,var(--fc) 74%,var(--fc-lo) 100%);
      border:1px solid rgba(0,0,0,.35);
      box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -8px 14px rgba(0,0,0,.28);
      transition:box-shadow .38s}
    .s3d-front::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:70%;height:6px;border-radius:3px;background:rgba(0,0,0,.28)}
    .s3d-front::after{content:'';position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:70%;height:6px;border-radius:3px;background:rgba(0,0,0,.28)}
    /* 顶面（俯视可见，带纸张切口边）：旋转后平移居中，与前后面对齐 */
    .s3d-top{left:-1px;right:-1px;top:0;height:44px;transform-origin:top center;transform:translateZ(-22px) rotateX(90deg);
      background:linear-gradient(180deg,var(--fc-hi) 0%,var(--fc) 55%,var(--fc-lo) 100%);
      border:1px solid rgba(0,0,0,.35);border-bottom:none}
    .s3d-top::after{content:'';position:absolute;left:8%;right:8%;top:55%;bottom:12%;border-radius:2px;
      background:repeating-linear-gradient(90deg,#efe8d6 0 3px,#cfc6ac 3px 5px);opacity:.85}
    /* 两侧面：同样居中，避免沿 Z 轴超出正面 */
    .s3d-side-r{top:-1px;bottom:0;right:0;width:44px;transform-origin:right center;transform:translateZ(-22px) rotateY(90deg);
      background:linear-gradient(90deg,var(--fc) 0%,var(--fc-lo) 100%);border:1px solid rgba(0,0,0,.35)}
    .s3d-side-l{top:-1px;bottom:0;left:0;width:44px;transform-origin:left center;transform:translateZ(-22px) rotateY(-90deg);
      background:linear-gradient(270deg,var(--fc) 0%,var(--fc-lo) 100%);border:1px solid rgba(0,0,0,.35)}
    /* 背面 */
    .s3d-back{inset:0;transform:translateZ(-22px);border-radius:4px;background:linear-gradient(90deg,var(--fc-lo),var(--fc),var(--fc-lo));filter:brightness(.5);border:1px solid rgba(0,0,0,.35)}
    .spine-txt{font-size:clamp(.88rem,1.05vw,1.02rem);font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);letter-spacing:.3em;padding:26px 0}
    .spine:hover{transform:translateY(-44px)}
    .spine:hover .s3d-front{box-shadow:0 30px 44px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.35)}
    .spine.taking{transform:translateY(-180px) scale(1.2) rotate(-3deg);transition:transform .5s cubic-bezier(.4,0,.6,1)}
    .spine-meta{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);writing-mode:horizontal-tb;font-size:.6rem;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;opacity:0;transition:opacity .3s}
    .spine:hover .spine-meta{opacity:1}

    /* ============ 第三层：档案页铺平 · 大版面3页 ============ */
    #viewPages{display:flex;flex-direction:column;align-items:center;padding:.9rem 1rem}
    .pg-bar{display:flex;align-items:center;justify-content:space-between;width:min(1500px,97vw);margin-bottom:.5rem}
    .pg-title{font-size:1rem;font-weight:600;font-family:var(--font-display)}
    .pg-title small{font-size:.72rem;color:var(--muted);font-weight:400;margin-left:.7rem}
    .pg-main{display:flex;flex-direction:column;align-items:center;width:100%;flex:1;opacity:0;transition:opacity .5s ease}
    /* 文件盒拿起 → 展示正面 → 从正面打开 */
    .takeout{position:fixed;top:3.5rem;bottom:2.4rem;left:0;right:0;display:grid;place-items:center;z-index:40;pointer-events:none}
    .takeout.out{animation:toOut .5s ease forwards}
    @keyframes toOut{to{transform:translateY(-60px);opacity:0}}
    .to-box{position:relative;width:250px;height:310px;perspective:1200px;transform-style:preserve-3d}
    /* 盒内：纸页堆（封面翻开后露出） */
    .to-inner{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,var(--fc),var(--fc-lo));border:1px solid rgba(0,0,0,.35);box-shadow:0 24px 50px rgba(0,0,0,.55)}
    .to-pages{position:absolute;inset:12px;border-radius:4px;background:repeating-linear-gradient(180deg,#f7f2e4 0 6px,#ddd2b8 6px 8px);box-shadow:inset 0 0 20px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);transition:opacity .45s ease .15s,transform .45s ease .15s}
    .to-box.opened .to-pages{opacity:1;transform:translateY(0)}
    /* 前封面：直接展示正面，再像翻书一样绕左侧书脊翻开 */
    .to-cover{position:absolute;inset:0;z-index:3;border-radius:8px;transform-origin:left center;
      background:linear-gradient(160deg,var(--fc-hi) 0%,var(--fc) 45%,var(--fc-lo) 100%);
      border:1px solid rgba(0,0,0,.35);
      box-shadow:0 24px 50px rgba(0,0,0,.55),inset 0 3px 8px rgba(255,255,255,.3),inset 0 -14px 26px rgba(0,0,0,.3);
      display:flex;align-items:center;justify-content:center;
      animation:toTurn .3s ease;
      transition:transform .5s cubic-bezier(.55,.05,.35,1)}
    @keyframes toTurn{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
    .to-box.opened .to-cover{transform:rotateY(-152deg);box-shadow:-16px 18px 44px rgba(0,0,0,.5)}
    .to-spine{position:absolute;left:-6px;top:0;bottom:0;width:12px;border-radius:6px;background:linear-gradient(90deg,var(--fc-lo),var(--fc));box-shadow:0 0 8px rgba(0,0,0,.4)}
    .to-label{width:80%;background:rgba(252,250,244,.96);border-radius:4px;padding:.9rem .7rem;text-align:center;color:#2a2012;font-weight:700;font-size:.92rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
    .to-label small{display:block;font-weight:400;font-size:.68rem;color:#6a5a3e;margin-top:.35rem}
    .spread-wrap{position:relative;display:flex;align-items:center;gap:.8rem;flex:1;width:min(1560px,98vw);justify-content:center}
    .spread{display:flex;gap:.9rem;transition:opacity .28s ease,transform .28s ease;perspective:2200px}
    .spread.flip-out-l{opacity:0;transform:translateX(-46px) rotateY(10deg)}
    .spread.flip-out-r{opacity:0;transform:translateX(46px) rotateY(-10deg)}
    .spread.flip-in{opacity:0;transform:translateX(30px) scale(.97)}
    .page-sheet{width:min(31.5vw,500px);height:100%;min-height:420px;background:linear-gradient(172deg,#fefcf7,#f5efe2);border-radius:4px;padding:1.6rem 1.5rem 2.2rem 2.8rem;color:#2c2418;box-shadow:0 14px 40px rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.07);position:relative;font-size:.88rem;line-height:1.95;overflow:hidden;opacity:0;transform:translateY(34px) rotateX(28deg);transition:opacity .5s ease,transform .55s cubic-bezier(.25,.9,.35,1.1)}
    .page-sheet.show{opacity:1;transform:translateY(0) rotateX(0)}
    .spread .page-sheet{height:calc(100vh - 15.5rem)}
    .page-sheet::before{content:'';position:absolute;top:0;left:50px;width:1px;height:100%;background:rgba(200,60,60,.18)}
    .page-sheet::after{content:'';position:absolute;bottom:0;right:0;border-width:0 22px 22px 0;border-style:solid;border-color:transparent #dcd2ba #dcd2ba transparent}
    .page-holes{position:absolute;left:14px;top:0;bottom:0;width:20px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
    .page-holes i{width:10px;height:10px;border-radius:50%;background:#0c1526;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7)}
    .page-title{font-size:1.05rem;font-weight:700;margin-bottom:.8rem;padding-bottom:.55rem;border-bottom:1.5px solid rgba(0,0,0,.12);color:#1a1510}
    .page-line{margin-bottom:.55rem}
    .page-stamp{position:absolute;top:14px;right:18px;font-size:.62rem;color:rgba(180,50,50,.6);border:1.5px solid rgba(180,50,50,.4);padding:2px 7px;border-radius:3px;transform:rotate(-8deg);letter-spacing:.12em}
    .page-no{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:.62rem;color:rgba(0,0,0,.35);font-family:var(--font-mono)}
    .pager{display:flex;align-items:center;gap:1.1rem;margin:.55rem 0 .5rem}
    .pg-btn{display:flex;align-items:center;gap:.45rem;padding:.8rem 1.5rem;border-radius:30px;border:2px solid rgba(77,217,232,.7);background:radial-gradient(circle,rgba(77,217,232,.3),rgba(77,217,232,.1));color:var(--cyan);font-size:1.05rem;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .2s;box-shadow:0 0 18px rgba(77,217,232,.35),inset 0 0 12px rgba(77,217,232,.15);animation:pgGlow 2.2s ease-in-out infinite}
    .pg-btn .pg-arr{font-size:1.5rem;line-height:1;font-weight:700}
    @keyframes pgGlow{0%,100%{box-shadow:0 0 14px rgba(77,217,232,.3),inset 0 0 8px rgba(77,217,232,.12)}50%{box-shadow:0 0 30px rgba(77,217,232,.65),inset 0 0 16px rgba(77,217,232,.3)}}
    .pg-btn:hover:not(:disabled){background:radial-gradient(circle,rgba(77,217,232,.55),rgba(77,217,232,.2));border-color:var(--cyan);transform:scale(1.08);animation:none;box-shadow:0 0 36px rgba(77,217,232,.8)}
    .pg-btn:active:not(:disabled){transform:scale(.96)}
    .pg-btn:disabled{opacity:.22;cursor:not-allowed;border-color:rgba(100,140,180,.3);background:rgba(30,40,55,.4);color:var(--muted);box-shadow:none;animation:none}
    .pg-ind{font-size:.78rem;color:var(--muted);font-family:var(--font-mono)}
    .pg-dots{display:flex;gap:.45rem;align-items:center}
    .pg-dots i{width:7px;height:7px;border-radius:50%;background:rgba(136,153,170,.35);cursor:pointer;transition:all .25s}
    .pg-dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:scale(1.25)}

    /* AI生成内容 · 单页滚动视图 */
    .scroll-view{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;padding:1.5rem 2rem 2rem;display:flex;flex-direction:column;gap:1.2rem;scrollbar-width:thin;scrollbar-color:rgba(77,217,232,.4) transparent}
    .scroll-view::-webkit-scrollbar{width:8px}
    .scroll-view::-webkit-scrollbar-track{background:transparent}
    .scroll-view::-webkit-scrollbar-thumb{background:rgba(77,217,232,.4);border-radius:4px}
    .scroll-view::-webkit-scrollbar-thumb:hover{background:rgba(77,217,232,.7)}
    .scroll-sheet{width:min(720px,90%);margin:0 auto;background:linear-gradient(172deg,#fefcf7,#f5efe2);border-radius:4px;padding:2rem 2.2rem 2.5rem 3.2rem;color:#2c2418;box-shadow:0 8px 28px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.07);position:relative;font-size:.92rem;line-height:2}
    .scroll-sheet::before{content:'';position:absolute;top:0;left:50px;width:1px;height:100%;background:rgba(200,60,60,.18)}
    .scroll-sheet::after{content:'';position:absolute;bottom:0;right:0;border-width:0 18px 18px 0;border-style:solid;border-color:transparent #dcd2ba #dcd2ba transparent}

    /* ============ 浮动机器人问答助手 ============ */
    .robot-fab{position:fixed;right:1.5rem;bottom:3.6rem;width:64px;height:64px;border-radius:50%;z-index:60;cursor:pointer;background:radial-gradient(circle at 35% 30%,#2b4a6e,#122036);border:2px solid rgba(77,217,232,.55);box-shadow:0 0 22px rgba(77,217,232,.35),inset 0 0 14px rgba(77,217,232,.15);animation:bob 3s ease-in-out infinite;transition:opacity .3s}
    .robot-fab:hover{box-shadow:0 0 34px rgba(77,217,232,.6)}
    .rb-head{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:38px;height:27px;border-radius:9px;background:linear-gradient(180deg,#3f6a94,#274a6d);border:1px solid rgba(120,220,240,.5)}
    .rb-eye{position:absolute;top:9px;width:7px;height:9px;border-radius:4px;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:blink 4s infinite}
    .rb-eye.l{left:9px}.rb-eye.r{right:9px}
    .rb-mouth{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:rgba(77,217,232,.85)}
    .rb-antenna{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:2px;height:9px;background:#7fdce8}
    .rb-antenna::after{content:'';position:absolute;top:-6px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:breathe 1.6s infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
    .chat-panel{position:fixed;right:1.5rem;bottom:3.6rem;width:360px;max-height:calc(100vh - 9rem);height:490px;z-index:61;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:rgba(252,254,255,.97);border:1px solid rgba(46,196,214,.25);box-shadow:0 22px 56px rgba(6,20,31,.24),inset 0 1px 0 rgba(255,255,255,.85);transform:translateY(24px) scale(.95);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.3,.64,1)}
    .chat-panel.open{transform:none;opacity:1;pointer-events:auto}
    .chat-head{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:linear-gradient(160deg,rgba(46,196,214,.1),rgba(240,248,252,.6));border-bottom:1px solid rgba(20,40,58,.08);flex-shrink:0}
    .chat-avatar{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6a94,#16294a);border:1.5px solid var(--signal);position:relative;flex-shrink:0}
    .chat-avatar::before{content:'';position:absolute;top:11px;left:8px;width:4px;height:6px;border-radius:2px;background:var(--cyan);box-shadow:11px 0 0 var(--cyan),0 0 5px var(--cyan),11px 0 5px var(--cyan)}
    .chat-id b{font-size:.9rem;color:var(--ink)}
    .chat-id small{display:block;font-size:.64rem;color:#5a7084}
    .chat-close{margin-left:auto;background:none;border:none;color:#5a7084;font-size:1.25rem;cursor:pointer;line-height:1;padding:.2rem .4rem}
    .chat-close:hover{color:var(--accent)}
    .chat-msgs{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
    .chat-msgs::-webkit-scrollbar{width:5px}.chat-msgs::-webkit-scrollbar-thumb{background:rgba(90,128,148,.28);border-radius:3px}
    .msg{max-width:88%;padding:.55rem .75rem;border-radius:10px;font-size:.78rem;line-height:1.7;word-break:break-word;color:var(--ink)}
    .msg.user{align-self:flex-end;background:rgba(46,196,214,.14);border:1px solid rgba(46,196,214,.22)}
    .msg.bot{align-self:flex-start;background:rgba(6,20,31,.03);border:1px solid rgba(20,40,58,.08)}
    .msg .loc{color:var(--accent);font-weight:600}
    .qa-open{display:inline-flex;align-items:center;gap:.3rem;margin:.45rem .4rem 0;padding:.32rem .75rem;border-radius:999px;border:1px solid rgba(46,196,214,.38);background:rgba(46,196,214,.12);color:var(--accent);font-size:.7rem;cursor:pointer;transition:all .2s}
    .qa-open:hover{background:rgba(46,196,214,.22)}
    .chat-quicks{display:flex;gap:.5rem;padding:0 .8rem .55rem;flex-wrap:wrap;flex-shrink:0}
    .quick{padding:.36rem .7rem;border-radius:999px;border:1px dashed rgba(26,122,146,.45);background:transparent;color:var(--accent);font-size:.7rem;cursor:pointer;transition:all .2s;font-family:var(--font-body)}
    .quick:hover{background:rgba(46,196,214,.12);border-style:solid}
    .chat-input{display:flex;gap:.5rem;padding:.6rem .8rem;border-top:1px solid rgba(20,40,58,.08);flex-shrink:0}
    .chat-input input{flex:1;background:rgba(255,255,255,.84);border:1px solid rgba(20,40,58,.12);border-radius:12px;padding:.5rem .7rem;color:var(--ink);font-size:.78rem;outline:none;font-family:var(--font-body)}
    .chat-input input:focus{border-color:rgba(46,196,214,.42);box-shadow:0 0 0 3px rgba(46,196,214,.14)}
    .chat-input button{padding:.5rem .95rem;border-radius:12px;border:none;background:linear-gradient(160deg,#1f8ea8,#176f84);color:#fff;font-weight:600;font-size:.78rem;cursor:pointer}
    .chat-input button:hover{filter:brightness(1.1)}

    .lib-footer{position:fixed;bottom:0;left:0;right:0;height:2.4rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(240,248,252,.5));backdrop-filter:blur(18px) saturate(1.2);border-top:1px solid rgba(255,255,255,.72);font-size:.72rem;color:#5a7084;z-index:50}
    .footer-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2f7d5a;box-shadow:0 0 6px rgba(47,125,90,.5);margin-right:.5rem;animation:breathe 2s infinite}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
    /* ============ 第二层：档案盒内材料列表（按类别分组） ============ */
    .material-view{width:100%;margin:0 auto;padding:8px 24px 64px}
    .mv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;padding:18px 24px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:0 2px 12px rgba(6,20,31,.06)}
    .mv-head-l{display:flex;align-items:center;gap:14px}
    .mv-head-icon{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,var(--signal),#3a7bd5);color:#fff;box-shadow:0 6px 16px rgba(46,196,214,.32);flex-shrink:0}
    .mv-head-icon svg{width:24px;height:24px}
    .mv-head h2{font-family:var(--font-display);font-size:1.25rem;font-weight:600;color:var(--ink);margin-bottom:3px}
    .mv-head .mv-sub{font-size:.78rem;color:var(--muted)}
    /* 每行一个类别 · 顶部简化小标题 · 下方材料横向列表 */
    .mv-cat{margin-bottom:24px}
    .mv-cat-title{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:.92rem;font-weight:600;color:var(--ink);margin-bottom:12px}
    .mv-cat-title::before{content:'';width:4px;height:15px;border-radius:2px;background:var(--cat-color,var(--signal))}
    .mv-cat-title .mv-cat-count{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);background:rgba(20,40,58,.06);padding:1px 8px;border-radius:999px;font-weight:500}
    .mv-row{display:flex;flex-wrap:wrap;gap:16px}
    /* 材料卡片：原有纸质档案页样式 · 竖向4:3(高:宽) · 名称+修改时间 · 无右下折角 */
    .mv-card{position:relative;width:240px;height:320px;background:linear-gradient(172deg,#fefcf7,#f5efe2);border:1px solid rgba(0,0,0,.07);border-radius:4px;color:#2c2418;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;overflow:hidden;display:flex;flex-direction:column;padding:22px 16px 20px 36px}
    .mv-card::before{content:'';position:absolute;top:0;left:34px;width:1px;height:100%;background:rgba(200,60,60,.18)}
    .mv-card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(0,0,0,.24)}
    .mv-holes{position:absolute;left:12px;top:0;bottom:0;width:14px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
    .mv-holes i{width:7px;height:7px;border-radius:50%;background:#0c1526;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7)}
    .mv-stamp{position:absolute;top:11px;right:13px;font-size:.55rem;color:rgba(180,50,50,.6);border:1.2px solid rgba(180,50,50,.4);padding:1px 5px;border-radius:3px;transform:rotate(-8deg);letter-spacing:.1em;z-index:1}
    .mv-card-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:#1a1510;line-height:1.5;text-align:center;margin:auto 0;display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .mv-card-footer{border-top:1px dashed rgba(0,0,0,.16);padding-top:9px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
    .mv-card-info{display:flex;align-items:center;justify-content:left;line-height:1.45}
    .mv-card-label{width: 62px;font-family:var(--font-mono);font-size:.75rem;color:rgba(0,0,0,.58);letter-spacing:.03em;flex-shrink:0}
    .mv-card-name{font-family:var(--font-mono);font-size:.75rem;font-weight:400;color:#1a1510}
    .mv-card-name.mv-approver{color:#a83232}
    .mv-card-time{font-family:var(--font-mono);font-size:.75rem;color:rgba(0,0,0,.58)}

    /* ============ 材料详情弹窗 ============ */
    .modal-overlay{position:fixed;inset:0;background:rgba(6,20,31,.55);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;padding:2rem}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal-content{position:relative;background:linear-gradient(172deg,#fefcf7,#f5efe2);border-radius:6px;width:100%;max-width:760px;height: 90vh;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.42);transform:scale(.92) translateY(12px);transition:transform .35s cubic-bezier(.2,.8,.2,1);border:1px solid rgba(0,0,0,.09)}
    .modal-overlay.active .modal-content{transform:scale(1) translateY(0)}
    .modal-content::before{content:'';position:absolute;top:0;left:56px;width:1px;height:100%;background:rgba(200,60,60,.18);z-index:2;pointer-events:none}
    .modal-holes{position:absolute;left:21px;top:0;bottom:0;width:20px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;z-index:2;pointer-events:none}
    .modal-holes i{width:11px;height:11px;border-radius:50%;background:#0c1526;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7)}
    .modal-header{position:relative;padding:22px 88px 16px 72px;border-bottom:2px solid #c0392b;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-shrink:0;background:transparent}
    .doc-issuer{font-family:'STFangsong','FangSong','FangSong_GB2312',仿宋,serif;font-size:1.06rem;font-weight:700;color:#c0392b;letter-spacing:.1em;line-height:1.4}
    .modal-header .modal-meta{font-size:.74rem;color:rgba(0,0,0,.45);margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .modal-header .modal-cat{color:rgba(180,50,50,.78);background:rgba(180,50,50,.08);padding:1px 9px;border-radius:999px;font-weight:500}
    .modal-header .ms-stamp{position:absolute;top:20px;right:64px;font-family:var(--font-display);font-size:.6rem;color:rgba(180,50,50,.6);border:1.4px solid rgba(180,50,50,.4);padding:2px 7px;border-radius:3px;transform:rotate(-8deg);letter-spacing:.12em}
    .modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.06);color:#1a1510;cursor:pointer;display:grid;place-items:center;font-size:1.3rem;line-height:1;transition:all .2s;flex-shrink:0}
    .modal-close:hover{background:rgba(180,50,50,.14);color:#a84848;transform:rotate(90deg)}
    .modal-body{flex:1;overflow-y:auto;padding:16px 44px 40px 72px}
    .doc-redline{height:2.5px;background:#c0392b;margin:0 0 16px}
    .doc-title{font-family:'SimHei','STHeiti','Microsoft YaHei',黑体,sans-serif;font-size:1.24rem;font-weight:700;color:#1a1510;text-align:center;line-height:1.5;margin:4px 0 22px}
    .doc-body{display:flex;flex-direction:column;gap:2px}
    .modal-body .ms-line{font-family:'STFangsong','FangSong','FangSong_GB2312',仿宋,serif;font-size:1rem;line-height:2.05;color:#2c2418;text-indent:2em;text-align:justify;padding:2px 0}
    .modal-body .ms-line.ms-h1{font-family:'SimHei',黑体,sans-serif;font-weight:700}

    function showView(level){

    function renderBreadcrumb(){

        const cat=DATA[state.boxIdx];

        h+=`<span class="bc-sep">›</span><span class="bc-item">${cat.name}</span>`;
        h+=`<span class="bc-sep">›</span><span class="bc-item active">${folder.name}</span>`;
      }
      bcEl.innerHTML=h;
    }
    function navTo(level,rec=true){ if(level===0){state.boxIdx=-1;state.folderIdx=-1;} if(level===1){state.folderIdx=-1;} showView(level); if(rec)recordHist(); }

    /* ===== 第一层：木制书架 + 档案盒（每行一个类别） ===== */
    /* 档案盒统一晨光蓝 #006DB8（偏深，明暗层次由 adjustColor 派生） */
    const FOLDER_COLORS = Array(12).fill('#006db8');
    function renderShelf(){
      views.shelf.innerHTML=`
        <div class="shelf-unit">
          ${DATA.map((cat,catIdx)=>`
            <div class="shelf-row">
              <div class="category-title">${cat.name}</div>
              <div class="boxes-container">
                ${cat.folders.map((folder,folderIdx)=>{
                  const colorIdx=(catIdx*3+folderIdx)%FOLDER_COLORS.length;
                  const fc=FOLDER_COLORS[colorIdx];
                  return `
                  <div class="archive-box" style="--folder-color:${fc};--folder-color-dark:${adjustColor(fc,-25)}" onclick="openFolder(${catIdx},${folderIdx})">
                    ${folder.name==='大型会议保障动员会'?'<div class="box-badge-new">新</div>':''}
                    <div class="folder-tooltip"><strong>${folder.name}</strong><small>${folder.date} · ${folder.pages.length} 份材料</small></div>
                    <div class="book-spine">
                      <div class="book-title-band"><div class="folder-label-text">${folder.name}</div></div>
                      <div class="book-line"></div>
                      <div class="book-hole"></div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>`;
    }
    function adjustColor(hex,percent){const num=parseInt(hex.replace('#',''),16);const r=Math.max(0,Math.min(255,(num>>16)+percent));const g=Math.max(0,Math.min(255,((num>>8)&0x00FF)+percent));const b=Math.max(0,Math.min(255,(num&0x0000FF)+percent));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

    function categorizeMaterial(page){
      const text = page.title + ' ' + (page.lines||[]).join(' ');
      let best=null, bestScore=0;
      MATERIAL_CATEGORIES.forEach(c=>{
        let sc=0;
        c.kw.forEach(k=>{ if(page.title.includes(k)) sc+=3; else if(text.includes(k)) sc+=1; });
        if(sc>bestScore){ bestScore=sc; best=c; }
      });
      return best || { name:'其他材料', color:'#5a7084' };
    }

    function genUploadTime(date, pi){
      const t=pi*17+5;
      const hh=String(8+Math.floor(t/60)).padStart(2,'0');
      const mm=String(t%60).padStart(2,'0');
      return `${date} ${hh}:${mm}`;

      const t=pi*26+788;
      const hh=String(Math.floor(t/60)).padStart(2,'0');
      const mm=String(t%60).padStart(2,'0');
      return `${date} ${hh}:${mm}`;

      const t=pi*11+1050;
      const hh=String(Math.floor(t/60)).padStart(2,'0');
      const mm=String(t%60).padStart(2,'0');
      return `${date} ${hh}:${mm}`;

              <div class="mv-row">
                ${g.items.map(m=>`
                  <div class="mv-card" onclick="openMaterial(${catIdx},${folderIdx},${m.pi})">
                    <div class="mv-holes"><i></i><i></i><i></i></div>
                    <div class="mv-stamp">归档</div>
                    <div class="mv-card-title">${m.title}</div>
                    <div class="mv-card-footer">
                      <div class="mv-card-info"><span class="mv-card-label">撰稿人：</span><span class="mv-card-name">${m.editor}</span></div>
                      <div class="mv-card-info"><span class="mv-card-label">撰稿时间：</span><span class="mv-card-time">${m.modTime}</span></div>
                      <div class="mv-card-info"><span class="mv-card-label">上传时间：</span><span class="mv-card-time">${m.uploadTime}</span></div>
                      <div class="mv-card-info"><span class="mv-card-label">审批人：</span><span class="mv-card-name">${m.approver}</span></div>
                      <div class="mv-card-info"><span class="mv-card-label">审批时间：</span><span class="mv-card-time">${m.approvalTime}</span></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>`;
      showView(1);
      if(rec)recordHist();
    }

    /* ===== 第三层：点击材料 → 弹窗展示详细内容 ===== */
    function fmtCnDate(d){
      const [y,m,dd]=d.split('-');
      return `${y}年${Number(m)}月${Number(dd)}日`;
    }
    function renderDocLine(l){
      let cls='';
      if(/^[一二三四五六七八九十]+、/.test(l)) cls=' ms-h1';
      else if(/^（[一二三四五六七八九十]+）/.test(l)) cls=' ms-h2';
      else if(/^\d{1,2}[、.]/.test(l)) cls=' ms-h3';
      return `<div class="ms-line${cls}">${l}</div>`;
    }
    function openMaterial(catIdx, folderIdx, pi){
      const cat=DATA[catIdx], folder=cat.folders[folderIdx], page=folder.pages[pi];
      const c=categorizeMaterial(page);
      const [y,m,d]=folder.date.split('-');
      document.getElementById('modalMeta').innerHTML=`<span class="modal-cat">${c.name}</span><span>${folder.name}</span><span>·</span><span>安保〔${y}〕${Number(m)}${Number(d)}号</span>`;
      document.getElementById('modalBody').innerHTML=`
        <div class="doc-redline"></div>
        <h3 class="doc-title">${page.title}</h3>
        <div class="doc-body">${page.lines.map(renderDocLine).join('')}</div>
        <div class="doc-sign"><span>会议安保指挥部</span><span>${fmtCnDate(folder.date)}</span></div>`;
      document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
    document.getElementById('modalClose').addEventListener('click',closeModal);
    document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget)closeModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
    function renderPagesView(catIdx, folderIdx, rec=true){
      const box=DATA[catIdx];
      const folder=box.folders[folderIdx];
      const total=folder.pages.length;
      const pages=Math.ceil(total/3);
      const isGenerated=folder.generated===true;
      // 与书架上被点击的书本保持同一颜色
      const fc=FOLDER_COLORS[(catIdx*3+folderIdx)%FOLDER_COLORS.length];
      const col={c:fc,hi:adjustColor(fc,22),lo:adjustColor(fc,-25)};
      
      if(isGenerated){
        // AI生成内容：单页滚动视图
        views.pages.innerHTML=`
          <div class="takeout" id="takeout">
            <div class="to-box" id="toBox" style="--fc:${col.c};--fc-hi:${col.hi};--fc-lo:${col.lo}">
              <div class="to-inner"><div class="to-pages"></div></div>
              <div class="to-cover"><div class="to-spine"></div><div class="to-label">${folder.name}<small>${folder.date} · 共 ${total} 页</small></div></div>
            </div>
          </div>
          <div class="pg-main" id="pgMain">
            <div class="pg-bar">
              <div class="pg-title" style="color:${box.color}">${folder.name}<small>${box.name} · ${folder.date} · AI生成 · 共 ${total} 页</small></div>
              <button class="back-btn" onclick="navTo(0)">← 返回档案架</button>
            </div>
            <div class="scroll-view" id="scrollView">
              ${folder.pages.map((p,pi)=>`
                <div class="scroll-sheet">
                  <div class="page-holes"><i></i><i></i><i></i></div>
                  <div class="page-stamp">归 档</div>
                  <div class="page-title">${p.title}</div>
                  ${p.lines.map(l=>`<div class="page-line">${l}</div>`).join('')}
                  <div class="page-no">第 ${pi+1} 页 · 共 ${total} 页</div>
                </div>`).join('')}
            </div>
          </div>`;
        views.pages._folder=folder;
        views.pages._ready=false;
        showView(2);
        if(rec)recordHist();
        const to=document.getElementById('takeout'), tob=document.getElementById('toBox'), main=document.getElementById('pgMain');
        setTimeout(()=>tob.classList.add('opened'),380);
        setTimeout(()=>{
          to.classList.add('out');
          main.style.opacity=1;
          views.pages._ready=true;
        },950);
        setTimeout(()=>to.remove(),1500);
      } else {
        // 普通内容：分页视图
        views.pages.innerHTML=`
          <div class="takeout" id="takeout">
            <div class="to-box" id="toBox" style="--fc:${col.c};--fc-hi:${col.hi};--fc-lo:${col.lo}">
              <div class="to-inner"><div class="to-pages"></div></div>
              <div class="to-cover"><div class="to-spine"></div><div class="to-label">${folder.name}<small>${folder.date} · 共 ${total} 页</small></div></div>
            </div>
          </div>
          <div class="pg-main" id="pgMain">
            <div class="pg-bar">
              <div class="pg-title" style="color:${box.color}">${folder.name}<small>${box.name} · ${folder.date} · 共 ${total} 页</small></div>
              <button class="back-btn" onclick="navTo(0)">← 返回档案架</button>
            </div>
            <div class="spread-wrap">
              <button class="pg-btn" id="pvPrev" title="上一页"><span class="pg-arr">&#8249;</span>上一页</button>
              <div class="spread" id="spread"></div>
              <button class="pg-btn" id="pvNext" title="下一页">下一页<span class="pg-arr">&#8250;</span></button>
            </div>
            <div class="pager">
              <div class="pg-dots" id="pgDots">${Array.from({length:pages},(_,k)=>`<i data-k="${k}" onclick="flipTo(${k})"></i>`).join('')}</div>
              <div class="pg-ind" id="pgInd"></div>
            </div>
          </div>`;
        views.pages._folder=folder;
        views.pages._ready=false;
        document.getElementById('pvPrev').onclick=()=>flipTo(pageIdx-1);
        document.getElementById('pvNext').onclick=()=>flipTo(pageIdx+1);
        showView(2);
        if(rec)recordHist();
        const to=document.getElementById('takeout'), tob=document.getElementById('toBox'), main=document.getElementById('pgMain');
        setTimeout(()=>tob.classList.add('opened'),380);
        setTimeout(()=>{
          to.classList.add('out');
          main.style.opacity=1;
          renderSpread(0);
          views.pages._ready=true;
        },950);
        setTimeout(()=>to.remove(),1500);
      }
    }

    /* ===== 第二层：俯视箱内 · 文件盒侧面书脊 ===== */
    function openFileboxes(i,rec=true){
      state.boxIdx=i;
      const box=DATA[i];
      views.filebox.innerHTML=`
        <div class="fb-scene">
          <div class="fb-head">
            <div class="fb-title" style="color:${box.color}">${box.name}<br><small>${box.intro}</small></div>
            <button class="back-btn" onclick="navTo(0)">← 返回档案架</button>
          </div>
          <div class="td-plane">
            <div class="td-box">
              <div class="td-flap td-flap-n"></div>
              <div class="td-flap td-flap-s"></div>
              <div class="td-flap td-flap-w"></div>
              <div class="td-flap td-flap-e"></div>
              <div class="td-walls"></div>
              <div class="td-bottom"></div>
              <div class="td-inner">
                ${box.folders.map((f,fi)=>{
                  const col=FB_COLORS[fi%FB_COLORS.length];
                  return `
                  <div class="spine" style="--fc:${col.c};--fc-hi:${col.hi};--fc-lo:${col.lo}" onclick="clickSpine(${fi},this)" title="${f.name}">
                    <div class="s3d s3d-back"></div>
                    <div class="s3d s3d-side-l"></div>
                    <div class="s3d s3d-side-r"></div>
                    <div class="s3d s3d-top"></div>
                    <div class="s3d s3d-front">
                      <div class="spine-txt">${f.name}</div>
                    </div>
                    <div class="spine-meta">${f.date} · ${f.pages.length}页</div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>`;
      showView(1);
      if(rec)recordHist();
    }
    function clickSpine(fi,el){
      if(el.classList.contains('taking'))return;
      el.classList.add('taking');
      setTimeout(()=>openPages(fi),320);
    }

    /* ===== 第三层：档案页铺平 · 每版面3页 · 翻页 ===== */
    let pageIdx=0;
    function openPages(fi,rec=true){
      state.folderIdx=fi;
      pageIdx=0;
      const box=DATA[state.boxIdx], folder=box.folders[fi];
      const total=folder.pages.length, pages=Math.ceil(total/3);
      const col=FB_COLORS[fi%FB_COLORS.length];
      views.pages.innerHTML=`
        <div class="takeout" id="takeout">
          <div class="to-box" id="toBox" style="--fc:${col.c};--fc-hi:${col.hi};--fc-lo:${col.lo}">
            <div class="to-inner"><div class="to-pages"></div></div>
            <div class="to-cover"><div class="to-spine"></div><div class="to-label">${folder.name}<small>${folder.date} · 共 ${total} 页</small></div></div>
          </div>
        </div>
        <div class="pg-main" id="pgMain">
          <div class="pg-bar">
            <div class="pg-title" style="color:${box.color}">${folder.name}<small>${box.name} · ${folder.date} · 共 ${total} 页</small></div>
            <button class="back-btn" onclick="openFileboxes(${state.boxIdx})">← 返回文件盒</button>
          </div>
          <div class="spread-wrap">
            <button class="pg-btn" id="pvPrev" title="上一页"><span class="pg-arr">&#8249;</span>上一页</button>
            <div class="spread" id="spread"></div>
            <button class="pg-btn" id="pvNext" title="下一页">下一页<span class="pg-arr">&#8250;</span></button>
          </div>
          <div class="pager">
            <div class="pg-dots" id="pgDots">${Array.from({length:pages},(_,k)=>`<i data-k="${k}" onclick="flipTo(${k})"></i>`).join('')}</div>
            <div class="pg-ind" id="pgInd"></div>
          </div>
        </div>`;
      views.pages._folder=folder;
      views.pages._ready=false;
      document.getElementById('pvPrev').onclick=()=>flipTo(pageIdx-1);
      document.getElementById('pvNext').onclick=()=>flipTo(pageIdx+1);
      showView(2);
      if(rec)recordHist();
      // 直接展示正面(0.3s) → 翻书式开盖(0.5s) → 盒体退场、档案页铺平
      const to=document.getElementById('takeout'), tob=document.getElementById('toBox'), main=document.getElementById('pgMain');
      setTimeout(()=>tob.classList.add('opened'),380);
      setTimeout(()=>{
        to.classList.add('out');
        main.style.opacity=1;
        renderSpread(0);
        views.pages._ready=true;
      },950);
      setTimeout(()=>to.remove(),1500);
    }
    function renderSpread(k){
      const folder=views.pages._folder;
      const slice=folder.pages.slice(k*3,k*3+3);
      const sp=document.getElementById('spread');
      sp.innerHTML=slice.map((p,pi)=>{
        const no=k*3+pi+1;
        return `
        <div class="page-sheet" style="transition-delay:${pi*110}ms">
          <div class="page-holes"><i></i><i></i><i></i></div>
          <div class="page-stamp">归 档</div>
          <div class="page-title">${p.title}</div>
          ${p.lines.map(l=>`<div class="page-line">${l}</div>`).join('')}
          <div class="page-no">第 ${no} 页 · 共 ${folder.pages.length} 页</div>
        </div>`;
      }).join('');
      const pages=Math.ceil(folder.pages.length/3);
      document.getElementById('pgInd').textContent=`版面 ${k+1} / ${pages} · 第 ${k*3+1}–${Math.min(k*3+3,folder.pages.length)} 页`;
      document.querySelectorAll('#pgDots i').forEach((d,di)=>d.classList.toggle('on',di===k));
      document.getElementById('pvPrev').disabled=k<=0;
      document.getElementById('pvNext').disabled=k>=pages-1;
      // 档案页铺平动画
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        sp.querySelectorAll('.page-sheet').forEach(el=>el.classList.add('show'));
      }));
    }
    function flipTo(k){
      if(!views.pages._ready)return;
      const folder=views.pages._folder;
      const pages=Math.ceil(folder.pages.length/3);
      if(k<0||k>=pages||k===pageIdx)return;
      const dir=k>pageIdx?'l':'r';
      const sp=document.getElementById('spread');
      sp.classList.add('flip-out-'+dir);
      setTimeout(()=>{
        pageIdx=k; renderSpread(k);
        sp.classList.remove('flip-out-'+dir);
        sp.classList.add('flip-in');
        requestAnimationFrame(()=>requestAnimationFrame(()=>sp.classList.remove('flip-in')));
      },280);
    }

    /* ===== 前进/后退导航历史 ===== */
    const hist=[{level:0,boxIdx:-1,folderIdx:-1}];
    let histPos=0;
    const btnBack=document.getElementById('btnBack'), btnFwd=document.getElementById('btnFwd');
    function recordHist(){
      const cur=hist[histPos], st={level:state.level,boxIdx:state.boxIdx,folderIdx:state.folderIdx};
      if(cur.level===st.level&&cur.boxIdx===st.boxIdx&&cur.folderIdx===st.folderIdx)return;
      hist.splice(histPos+1);
      hist.push(st); histPos=hist.length-1;
      updateNavBtns();
    }
    function applyHist(st){
      if(st.level===0)navTo(0,false);
      else if(st.level===1)openFolder(st.boxIdx,st.folderIdx,false);
      else openPages(st.folderIdx,false);
    }
    function goBack(){ if(histPos>0){histPos--;applyHist(hist[histPos]);updateNavBtns();} }
    function goForward(){ if(histPos<hist.length-1){histPos++;applyHist(hist[histPos]);updateNavBtns();} }
    function updateNavBtns(){ btnBack.disabled=histPos<=0; btnFwd.disabled=histPos>=hist.length-1; }
    btnBack.addEventListener('click',goBack);
    btnFwd.addEventListener('click',goForward);
    document.addEventListener('keydown',e=>{
      if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goBack();}
      if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();goForward();}
      if(state.level===2&&!e.altKey){
        if(e.key==='ArrowLeft')flipTo(pageIdx-1);
        if(e.key==='ArrowRight')flipTo(pageIdx+1);
      }
    });

    /* ===== 机器人问答助手 ===== */
    const INDEX=[];
    DATA.forEach((b,bi)=>b.folders.forEach((f,fi)=>f.pages.forEach((p,pi)=>INDEX.push({bi,fi,pi,cat:b.name,folder:f.name,date:f.date,title:p.title,text:p.lines.join(' ')}))));
    function bigrams(s){s=(s||'').replace(/[？?！!，,。.:：、；;"'\s（）()《》]+/g,'');const g=[];for(let i=0;i<s.length-1;i++)g.push(s.substr(i,2));return [...new Set(g)]}
    function esc(s){return String(s).replace(/</g,'&lt;')}

    function answer(q){
      const locateW=['在哪','哪里','哪个','位置','找','存放','归档','几页'];
      const isLoc=locateW.some(w=>q.includes(w));
      const qg=bigrams(q);
      // 1) 文档定位：命中档案袋名/页名
      const hits=[];
      INDEX.forEach(it=>{
        let sc=0;
        if(q.includes(it.folder))sc+=6;
        if(q.includes(it.title))sc+=6;
        qg.forEach(g=>{if(it.folder.includes(g)||it.title.includes(g))sc+=1});
        if(sc>0)hits.push({...it,sc});
      });
      hits.sort((a,b)=>b.sc-a.sc);
      const strong=hits.filter(h=>h.sc>=5);
      if(isLoc&&strong.length){
        const h=strong[0];
        return `📍 已定位：<span class="loc">${h.cat}</span> 档案箱 › <span class="loc">${h.folder}</span> 档案盒 › 第 ${h.pi+1} 份《<span class="loc">${h.title}</span>》（${h.date}）<br><button class="qa-open" onclick="jumpTo(${h.bi},${h.fi},${h.pi})">打开该材料</button>`;
      }
      // 2) 内容问答：二元组对页正文打分
      const scored=INDEX.map(it=>{
        let sc=0;
        qg.forEach(g=>{
          if(it.title.includes(g))sc+=2;
          if(it.folder.includes(g))sc+=1.5;
          if(it.cat.includes(g))sc+=1;
          it.text.split(/[。；、]/).forEach(seg=>{if(seg.includes(g))sc+=1});
        });
        return {...it,sc};
      }).filter(h=>h.sc>=3).sort((a,b)=>b.sc-a.sc).slice(0,2);
      if(!scored.length){
        return `没有找到相关内容。你可以试试：<br>· 文档定位：“大型会议保障动员会的会议纪要在哪里？”<br>· 知识问答：“舆情预警怎么做的？”<br><button class="qa-open" onclick="useQuick(0)">📍 试问定位问题</button><button class="qa-open" onclick="useQuick(1)">💡 试问知识问题</button>`;
      }
      let html=`📚 从归档材料中找到相关内容：<br>`;
      scored.forEach(h=>{
        const segs=h.text.split(' ').filter(l=>qg.some(g=>l.includes(g))).slice(0,2);
        html+=`▍<span class="loc">${h.cat} › ${h.folder}</span> 第 ${h.pi+1} 页《${h.title}》<br>`+(segs.length?segs.map(s=>`「${esc(s)}」`).join('<br>'):'详见原文页')+'<br>';
      });
      const t=scored[0];
      html+=`<button class="qa-open" onclick="jumpTo(${t.bi},${t.fi},${t.pi})">打开原文查看</button>`;
      return html;
    }
    function jumpTo(bi,fi,pi){ openFolder(bi,fi); if(pi!=null&&pi>=0){ setTimeout(()=>openMaterial(bi,fi,pi),400); } }

    const fab=document.getElementById('robotFab'),panel=document.getElementById('chatPanel'),msgs=document.getElementById('chatMsgs'),inp=document.getElementById('chatInput');
    function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
    function ask(q){addMsg('user',esc(q));setTimeout(()=>addMsg('bot',answer(q)),380)}
    const QUICKS=['大型会议保障动员会的会议纪要在哪里？','舆情预警怎么做的？'];
    function useQuick(k){ask(QUICKS[k])}
    fab.addEventListener('click',()=>{
      panel.classList.add('open');fab.style.opacity=0;fab.style.pointerEvents='none';
      if(!msgs.dataset.init){addMsg('bot','您好，我是<b>档案助手</b> 🤖<br>我可以：① 查询档案文档位置并直接打开；② 基于归档沉淀内容回答提问<br>点击下方快捷键可模拟提问');msgs.dataset.init=1}
    });
    document.getElementById('chatClose').addEventListener('click',()=>{
      panel.classList.remove('open');fab.style.opacity='';fab.style.pointerEvents='';
    });
    document.getElementById('chatSend').addEventListener('click',sendMsg);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
    function sendMsg(){const q=inp.value.trim();if(!q)return;inp.value='';ask(q)}
    document.querySelectorAll('.quick').forEach(b=>b.addEventListener('click',()=>useQuick(+b.dataset.k)));

    /* ===== 读取写作工作台生成的成果，存入对应类别的档案盒 ===== */
    (function loadGenerated(){
      try{
        const list=JSON.parse(localStorage.getItem('xz-generated-archives')||'[]');
        list.forEach(rec=>{
          const cat=DATA.find(c=>c.name===rec.category)||DATA[0];
          const folder={
            name:rec.bookName||rec.title,
            date:rec.date||new Date(rec.savedAt||Date.now()).toISOString().slice(0,10),
            info:`AI生成 · ${rec.words?rec.words+'字 · ':''}${rec.pages.length} 页`,
            pages:rec.pages,
            generated:true
          };
          const idx=cat.folders.findIndex(f=>f.name===folder.name);
          if(idx>=0) cat.folders[idx]=folder; else cat.folders.push(folder);
        });
      }catch(e){}
    })();

    /* 大型会议保障动员会档案盒排在活动安保类最后一个（含 AI 生成档案盒之后） */
    {
      const boxes = DATA[0].folders;
      const i = boxes.findIndex(f => f.name === '大型会议保障动员会');
      if (i > -1) boxes.push(boxes.splice(i, 1)[0]);
    }

    renderShelf();
    showView(0);
    updateNavBtns();
  </script>
</body>
</html>
